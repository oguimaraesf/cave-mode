<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>PROJETO 100 — Dashboard</title>

<style>
  :root {
    --bg: #050505; --card: #0e0e11; --card2: #141419; --line: #232329;
    --txt: #f2f2f2; --mut: #8b8b95; 
    --grn: #22c55e; --grn2: #16a34a; --red: #ef4444; --amb: #f59e0b;
    --blue: #3b82f6; --purple: #a855f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; padding-bottom: 48px;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }

  /* ===== CABEÇALHO ===== */
  .top { text-align: center; padding: 10px 0 0; }
  h1 { font-size: clamp(24px, 5vw, 32px); letter-spacing: 4px; margin: 0; font-weight: 900; text-transform: uppercase; }
  h2.section-title { font-size: 11px; letter-spacing: 2px; color: var(--mut); text-transform: uppercase; margin: 0 0 10px 0; }

  /* ===== CARTÕES ===== */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  
  /* ===== TABELAS DOS DASHBOARDS ===== */
  .table-box {
    max-height: 220px;
    overflow-y: auto;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card2);
  }
  .table-box::-webkit-scrollbar { width: 6px; height: 6px; }
  .table-box::-webkit-scrollbar-thumb { background: #2c2c34; border-radius: 4px; }
  
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
  }
  th {
    position: sticky;
    top: 0;
    background: #18181f;
    color: var(--mut);
    padding: 9px 8px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    z-index: 2;
  }
  td {
    padding: 8px 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    color: var(--txt);
  }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.05); }
  tbody tr.active-row {
    background: rgba(34, 197, 94, 0.12);
    font-weight: 700;
  }
  .saldo-pos { color: var(--grn); font-weight: 700; }
  .saldo-neg { color: var(--red); font-weight: 700; }
  .sleep-tag { color: var(--purple); font-weight: 700; }

  /* ===== ESTATÍSTICAS ===== */
  .stats-row { display: flex; gap: 10px; }
  .stat-box { 
    flex: 1; background: var(--card2); border: 1px solid var(--line); 
    border-radius: 12px; padding: 16px 10px; text-align: center; 
  }
  .stat-box h4 { margin: 0 0 8px; font-size: 9px; color: var(--mut); letter-spacing: 1px; text-transform: uppercase; }
  .stat-box span { display: block; font-size: 18px; font-weight: 900; }
  .stat-box span.highlight { color: var(--grn); }

  /* ===== GRID 100 DIAS ===== */
  .grid-wrap { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 6px; }
  .chip { 
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); 
    background: var(--card2); color: var(--mut); font-size: 10px; font-weight: 800; 
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .chip.hoje { border-color: var(--amb); }
  .chip.sel { outline: 2px solid #fff; outline-offset: 2px; }
  .chip.c { background: var(--grn2); border-color: var(--grn); color: #03130a; }

  /* ===== FORMULÁRIO DO DIA ===== */
  .navrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: var(--card2); padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
  .dia-atual { font-weight: 900; font-size: 16px; letter-spacing: 2px; }
  .btn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 16px; font-size: 14px; cursor: pointer; font-weight: 700; }
  .btn:active { transform: scale(0.95); }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .field { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .field label { display: block; font-size: 9px; color: var(--mut); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
  .field input { width: 100%; background: transparent; border: none; outline: none; color: var(--txt); font-size: 18px; font-weight: 900; padding: 0; }
  .field input::placeholder { color: #3a3a42; }

  .checks-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .chk { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; user-select: none; transition: 0.2s; }
  .chk input { display: none; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3a3a42; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: transparent; }
  .chk.on { border-color: var(--grn); background: rgba(34,197,94,0.08); }
  .chk.on .box { background: var(--grn); border-color: var(--grn); color: #03130a; }
  .chk .t { flex: 1; font-size: 13px; font-weight: 600; }

  /* ===== AJUSTES ===== */
  .tools { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .tools .btn { font-size: 11px; padding: 6px 12px; }
  .danger { color: var(--red); border-color: rgba(239,68,68,0.4); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>PROJETO 100</h1>
  </header>

  <!-- DASHBOARD 1: TABELA DE DÉFICIT & SONO -->
  <section class="card">
    <h2 class="section-title">Dashboard — Déficit Calórico & Sono</h2>
    <div class="table-box" id="scrollTableCal">
      <table>
        <thead>
          <tr>
            <th>Dia</th>
            <th>Gasto (kcal)</th>
            <th>Consumo (kcal)</th>
            <th>Déficit / Saldo</th>
            <th>Sleep Score</th>
          </tr>
        </thead>
        <tbody id="tbodyCal"></tbody>
      </table>
    </div>
  </section>

  <!-- DASHBOARD 2: TABELA DE MACROS -->
  <section class="card">
    <h2 class="section-title">Dashboard — Macronutrientes</h2>
    <div class="table-box" id="scrollTableMac">
      <table>
        <thead>
          <tr>
            <th>Dia</th>
            <th>Carboidratos</th>
            <th>Proteínas</th>
            <th>Gorduras</th>
            <th>Total Kcal</th>
          </tr>
        </thead>
        <tbody id="tbodyMac"></tbody>
      </table>
    </div>
  </section>

  <!-- ESTATÍSTICAS -->
  <div class="stats-row">
    <div class="stat-box">
      <h4>Dias Sem Doce</h4>
      <span id="stDoce">0/100</span>
    </div>
    <div class="stat-box">
      <h4>Dias Sem Compulsão</h4>
      <span id="stComp">0/100</span>
    </div>
    <div class="stat-box">
      <h4>Déficit Acumulado</h4>
      <span id="stDeficit" class="highlight">0 kcal</span>
    </div>
  </div>

  <!-- GRID 100 DIAS -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- FORMULÁRIO DO DIA -->
  <section class="card" id="formCard">
    <h2
