<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Cave Mode - 90 Dias</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --border: #334155;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.8rem; margin-bottom: 4px; color: #fff; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        .progress-container { width: 100%; background-color: var(--border); border-radius: 8px; height: 12px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background-color: var(--success); width: 0%; transition: width 0.3s ease; }
        .total-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; font-size: 0.85rem; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .total-stats div { text-align: center; }
        .total-stats span { display: block; color: var(--text-muted); font-size: 0.75rem; }
        .total-stats b { font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
        .day-btn { background-color: var(--border); border: none; border-radius: 8px; padding: 12px 0; color: var(--text-color); font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .day-btn.completed { background-color: var(--success); color: #fff; }
        .day-btn.active { border: 2px solid var(--accent); }
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .task-item:last-child { border-bottom: none; }
        .task-label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; cursor: pointer; }
        .task-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        .btn-danger { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; }
        .add-task-box { display: flex; gap: 8px; margin-top: 12px; }
        .add-task-box input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-color); font-size: 0.9rem; }
        .btn-primary { background-color: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 16px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .meal-box { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
