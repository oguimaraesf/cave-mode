<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>PROJETO 100 — Dashboard</title>
<!-- Importando Chart.js para os gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #050505; --card: #0e0e11; --card2: #141419; --line: #232329;
    --txt: #f2f2f2; --mut: #8b8b95; 
    --grn: #22c55e; --grn2: #16a34a; --red: #ef4444; --amb: #f59e0b;
    --blue: #3b82f6; --purple: #a855f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; padding-bottom: 48px;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }

  /* ===== TIPOGRAFIA E CABEÇALHO ===== */
  .top { text-align: center; padding: 10px 0 0; }
  h1 { font-size: clamp(24px, 5vw, 32px); letter-spacing: 4px; margin: 0; font-weight: 900; text-transform: uppercase; }
  h2.section-title { font-size: 11px; letter-spacing: 2px; color: var(--mut); text-transform: uppercase; margin: 0 0 10px 0; }

  /* ===== CARTÕES ===== */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  
  /* ===== GRÁFICOS ===== */
  .chart-container { position: relative; height: 220px; width: 100%; margin-bottom: 10px; }
  .chart-container:last-child { margin-bottom: 0; }

  /* ===== ESTATÍSTICAS ===== */
  .stats-row { display: flex; gap: 10px; }
  .stat-box { 
    flex: 1; background: var(--card2); border: 1px solid var(--line); 
    border-radius: 12px; padding: 16px 10px; text-align: center; 
  }
  .stat-box h4 { margin: 0 0 8px; font-size: 9px; color: var(--mut); letter-spacing: 1px; text-transform: uppercase; }
  .stat-box span { display: block; font-size: 20px; font-weight: 900; }
  .stat-box span.highlight { color: var(--grn); }

  /* ===== GRID 100 DIAS ===== */
  .grid-wrap { position: relative; padding: 20px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); }
  .grid-wrap::before { content: '1'; position: absolute; top: 6px; left: 10px; font-size: 10px; font-weight: 900; color: var(--mut); }
  .grid-wrap::after { content: '100'; position: absolute; bottom: 6px; right: 10px; font-size: 10px; font-weight: 900; color: var(--mut); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 6px; }
  .chip { 
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); 
    background: var(--card2); color: var(--mut); font-size: 10px; font-weight: 800; 
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .chip.hoje { border-color: var(--amb); }
  .chip.sel { outline: 2px solid #fff; outline-offset: 2px; }
  .chip.c { background: var(--grn2); border-color: var(--grn); color: #03130a; }

  /* ===== FORMULÁRIO DO DIA ===== */
  .navrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: var(--card2); padding: 8px; border-radius: 12px; border: 1px solid var(--line);}
  .dia-atual { font-weight: 900; font-size: 16px; letter-spacing: 2px; }
  .btn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 16px; font-size: 14px; cursor: pointer; font-weight: 700; }
  .btn:active { transform: scale(0.95); }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .field { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .field label { display: block; font-size: 9px; color: var(--mut); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
  .field input { width: 100%; background: transparent; border: none; outline: none; color: var(--txt); font-size: 18px; font-weight: 900; padding: 0; }
  .field input::placeholder { color: #3a3a42; }

  .checks-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .chk { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; user-select: none; transition: 0.2s; }
  .chk input { display: none; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #3a3a42; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: transparent; }
  .chk.on { border-color: var(--grn); background: rgba(34,197,94,0.08); }
  .chk.on .box { background: var(--grn); border-color: var(--grn); color: #03130a; }
  .chk .t { flex: 1; font-size: 13px; font-weight: 600; }

  /* ===== AJUSTES ===== */
  .tools { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .tools .btn { font-size: 11px; padding: 6px 12px; }
  .danger { color: var(--red); border-color: rgba(239,68,68,0.4); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>PROJETO 100</h1>
  </header>

  <!-- DASHBOARDS -->
  <section class="card">
    <h2 class="section-title">Dashboard - Déficit Calórico & Sono</h2>
    <div class="chart-container">
      <canvas id="chartCalories"></canvas>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">Distribuição de Macros</h2>
    <div class="chart-container">
      <canvas id="chartMacros"></canvas>
    </div>
  </section>

  <!-- ESTATÍSTICAS -->
  <div class="stats-row">
    <div class="stat-box">
      <h4>Dias Sem Doce</h4>
      <span id="stDoce">0/100</span>
    </div>
    <div class="stat-box">
      <h4>Dias Sem Compulsão</h4>
      <span id="stComp">0/100</span>
    </div>
    <div class="stat-box">
      <h4>Déficit Acumulado</h4>
      <span id="stDeficit" class="highlight">0 kcal</span>
    </div>
  </div>

  <!-- GRID DE 100 DIAS -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- FORMULÁRIO DO DIA -->
  <section class="card">
    <h2 class="section-title">Formulário do Dia</h2>
    <div class="navrow">
      <button class="btn" id="prev">←</button>
      <div class="dia-atual" id="diaLabel">DIA 1</div>
      <button class="btn" id="next">→</button>
    </div>

    <div class="checks-row">
      <label class="chk" id="lblTreino">
        <input type="checkbox" id="treino"><span class="box">✓</span><span class="t">Treino realizado</span>
      </label>
      <label class="chk" id="lblDoce">
        <input type="checkbox" id="doce"><span class="box">✓</span><span class="t">Dia sem doce</span>
      </label>
      <label class="chk" id="lblComp">
        <input type="checkbox" id="comp"><span class="box">✓</span><span class="t">Dia sem compulsão</span>
      </label>
    </div>

    <div class="form-grid">
      <div class="field"><label>🔥 Gasto calórico (kcal)</label><input type="number" id="gasto" placeholder="0"></div>
      <div class="field"><label>🍽️ Consumo calórico (kcal)</label><input type="number" id="consumo" placeholder="0"></div>
      <div class="field"><label>💤 Sleep Score (0-100)</label><input type="number" id="sleep" placeholder="0" max="100"></div>
      <div class="field"><label>🍞 Carboidratos (g)</label><input type="number" id="carbs" placeholder="0"></div>
      <div class="field"><label>🥩 Proteínas (g)</label><input type="number" id="prot" placeholder="0"></div>
      <div class="field"><label>🥑 Gorduras (g)</label><input type="number" id="fat" placeholder="0"></div>
    </div>
  </section>

  <!-- CONTROLES -->
  <div class="tools">
    <button class="btn" id="exp">Exportar Backup</button>
    <button class="btn" id="imp">Importar Backup</button>
    <button class="btn danger" id="zap">Apagar Tudo</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</div>

<script>
// ================= ESTADO & ARMAZENAMENTO =================
const KEY = 'projeto100_v2', TOTAL = 100;
function emptyDay() { return { treino: false, doce: false, comp: false, gasto: '', consumo: '', sleep: '', carbs: '', prot: '', fat: '' }; }
function load() { 
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.days) return s; } catch(e){} 
  return { startDate: new Date().toISOString().split('T')[0], days: {} }; 
}
let state = load();
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function getD(n) { return Object.assign(emptyDay(), state.days[n] || {}); }
function setD(n, d) { state.days[n] = d; save(); }

// Cálculo do dia atual baseado na data de início
const inicioData = new Date(state.startDate + 'T00:00:00');
const hojeData = new Date(); hojeData.setHours(0,0,0,0);
let diaHoje = Math.min(TOTAL, Math.max(1, Math.floor((hojeData - inicioData)/864e5) + 1));
let diaSelecionado = diaHoje;

// ================= GRÁFICOS (CHART.JS) =================
Chart.defaults.color = '#8b8b95';
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, sans-serif';

let chartCal, chartMac;

function initCharts() {
  const ctxCal = document.getElementById('chartCalories').getContext('2d');
  chartCal = new Chart(ctxCal, {
    type: 'bar',
    data: { labels: Array.from({length: TOTAL}, (_, i) => i+1), datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: {size: 10} } } },
      scales: {
        y: { type: 'linear', display: true, position: 'left', title: {display: true, text: 'Kcal', font:{size:9}} },
        y1: { type: 'linear', display: true, position: 'right', grid: {drawOnChartArea: false}, min: 0, max: 100, title: {display: true, text: 'Sleep', font:{size:9}} },
        x: { ticks: { maxTicksLimit: 20 } }
      }
    }
  });

  const ctxMac = document.getElementById('chartMacros').getContext('2d');
  chartMac = new Chart(ctxMac, {
    type: 'bar',
    data: { labels: Array.from({length: TOTAL}, (_, i) => i+1), datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: {size: 10} } } },
      scales: {
        x: { stacked: true, ticks: { maxTicksLimit: 20 } },
        y: { stacked: true, title: {display: true, text: 'Gramas (g)', font:{size:9}} }
      }
    }
  });
}

function updateCharts() {
  const data = Array.from({length: TOTAL}, (_, i) => getD(i + 1));
  
  // Update Calories & Sleep Chart
  chartCal.data.datasets = [
    { label: 'Gasto (kcal)', type: 'line', data: data.map(d => d.gasto || null), borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 2, tension: 0.3, yAxisID: 'y' },
    { label: 'Consumo (kcal)', type: 'line', data: data.map(d => d.consumo || null), borderColor: '#22c55e', backgroundColor: '#22c55e', borderWidth: 2, tension: 0.3, yAxisID: 'y' },
    { label: 'Sleep Score', type: 'bar', data: data.map(d => d.sleep || null), backgroundColor: 'rgba(168, 85, 247, 0.5)', yAxisID: 'y1', borderRadius: 4 }
  ];
  chartCal.update();

  // Update Macros Chart
  chartMac.data.datasets = [
    { label: 'Carboidratos', data: data.map(d => d.carbs || null), backgroundColor: '#3b82f6', borderRadius: 2 },
    { label: 'Proteínas', data: data.map(d => d.prot || null), backgroundColor: '#ef4444', borderRadius: 2 },
    { label: 'Gorduras', data: data.map(d => d.fat || null), backgroundColor: '#f59e0b', borderRadius: 2 }
  ];
  chartMac.update();
}

// ================= UI & LÓGICA =================
const $ = id => document.getElementById(id);

function renderGrid() {
  let html = '';
  for(let n = 1; n <= TOTAL; n++) {
    const d = getD(n);
    const classes = ['chip'];
    // Considera "concluído" (verde) se fez o básico: Treino, Sem Doce, Sem Compulsão
    if(d.treino && d.doce && d.comp) classes.push('c');
    if(n === diaHoje) classes.push('hoje');
    if(n === diaSelecionado) classes.push('sel');
    html += `<button class="${classes.join(' ')}" data-n="${n}">${n}</button>`;
  }
  $('grid').innerHTML = html;
}

function renderStats() {
  let doces = 0, comp = 0, deficitAcumulado = 0;
  for(let n = 1; n <= TOTAL; n++) {
    const d = getD(n);
    if(d.doce) doces++;
    if(d.comp) comp++;
    if(d.gasto && d.consumo) {
      deficitAcumulado += (parseFloat(d.gasto) - parseFloat(d.consumo));
    }
  }
  $('stDoce').textContent = `${doces}/${TOTAL}`;
  $('stComp').textContent = `${comp}/${TOTAL}`;
  
  const defEl = $('stDeficit');
  defEl.textContent = `${deficitAcumulado > 0 ? '+' : ''}${deficitAcumulado.toLocaleString('pt-BR')} kcal`;
  defEl.style.color = deficitAcumulado >= 0 ? 'var(--grn)' : 'var(--red)';
}

function syncCheck(id, lblId, val) {
  const el = $(id), lbl = $(lblId);
  el.checked = val;
  val ? lbl.classList.add('on') : lbl.classList.remove('on');
}

function renderForm() {
  $('diaLabel').textContent = `DIA ${diaSelecionado}`;
  $('prev').disabled = diaSelecionado <= 1;
  $('next').disabled = diaSelecionado >= TOTAL;

  const d = getD(diaSelecionado);
  syncCheck('treino', 'lblTreino', d.treino);
  syncCheck('doce', 'lblDoce', d.doce);
  syncCheck('comp', 'lblComp', d.comp);
  
  $('gasto').value = d.gasto; $('consumo').value = d.consumo; $('sleep').value = d.sleep;
  $('carbs').value = d.carbs; $('prot').value = d.prot; $('fat').value = d.fat;
}

function updateApp() { renderGrid(); renderStats(); renderForm(); updateCharts(); }

// ================= EVENTOS =================
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.chip'); 
  if(!b) return;
  diaSelecionado = +b.dataset.n; 
  updateApp();
});

$('prev').onclick = () => { if(diaSelecionado > 1) { diaSelecionado--; updateApp(); } };
$('next').onclick = () => { if(diaSelecionado < TOTAL) { diaSelecionado++; updateApp(); } };

// Atualiza dados no formulário
function onFieldChange() {
  const d = getD(diaSelecionado);
  d.treino = $('treino').checked; syncCheck('treino', 'lblTreino', d.treino);
  d.doce = $('doce').checked; syncCheck('doce', 'lblDoce', d.doce);
  d.comp = $('comp').checked; syncCheck('comp', 'lblComp', d.comp);
  
  d.gasto = $('gasto').value; d.consumo = $('consumo').value; d.sleep = $('sleep').value;
  d.carbs = $('carbs').value; d.prot = $('prot').value; d.fat = $('fat').value;
  
  setD(diaSelecionado, d);
  updateApp();
}

['treino', 'doce', 'comp'].forEach(id => $(id).addEventListener('change', onFieldChange));
['gasto', 'consumo', 'sleep', 'carbs', 'prot', 'fat'].forEach(id => $(id).addEventListener('input', onFieldChange));

// Ferramentas (Backup / Limpeza)
$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'}));
  a.download = 'projeto100-v2-backup.json'; a.click();
};
$('imp').onclick = () => $('file').click();
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result); if(!p || !p.days) throw 0;
      state = p; save(); diaSelecionado = 1; updateApp(); alert('Backup importado!');
    } catch(_) { alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
});
$('zap').onclick = () => {
  if(confirm('Tem certeza que deseja apagar TUDO?')) {
    state.days = {}; save(); updateApp();
  }
};

// Inicialização
initCharts();
updateApp();
</script>
</body>
</html>
